<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Operación Ciberguardia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">◈</span><span>OPERACIÓN<br><strong>CIBERGUARDIA</strong></span></div>
      <div class="mission"><span class="signal"></span>MISIÓN: DETENER EL ATAQUE</div>
      <button class="reset" id="resetButton" type="button">Reiniciar partida</button>
    </header>

    <section class="hero hero-compact">
      <div class="hero-spacer" aria-hidden="true"></div>
      <div class="scoreboard" aria-label="Marcador">
        <div><span class="score-label">ACERTADAS</span><strong id="score">0</strong></div>
        <div><span class="score-label">PREGUNTA</span><strong><span id="questionNumber">1</span>/<span id="questionTotal">8</span></strong></div>
      </div>
    </section>

    <section class="game-grid">
      <aside class="attack-panel" aria-label="Progreso del atacante">
        <div class="panel-heading"><span>TRAZA DEL ATAQUE</span><span id="dangerText">BAJO RIESGO</span></div>
        <div class="attack-route" id="attackRoute">
          <div class="route-line"></div>
          <div class="checkpoint checkpoint-1 start"><span>01</span><small>INTRUSIÓN</small></div>
          <div class="checkpoint checkpoint-2"><span>02</span><small>ESCALADA</small></div>
          <div class="checkpoint checkpoint-3"><span>03</span><small>ACCESO</small></div>
          <div class="checkpoint checkpoint-4"><span>04</span><small>DELITO</small></div>
        <div class="hacker hacker-stage-0" id="hacker" aria-label="Hacker avanza por la ruta"></div>
        </div>
        <p class="attack-copy" id="attackCopy">El atacante aún está fuera del sistema.</p>
        <div class="legend"><span><i class="safe-dot"></i>Respuesta correcta</span><span><i class="danger-dot"></i>Respuesta incorrecta</span></div>
      </aside>

      <section class="question-panel" aria-live="polite">
        <div class="question-heading">
          <div>
            <div class="category" id="category">CONCEPTOS BÁSICOS</div>
            <h2 id="question">Cargando misión...</h2>
          </div>
          <div class="question-image art-0" id="questionImage" role="img" aria-label="Ilustración relacionada con la pregunta"></div>
        </div>
        <div class="answers" id="answers"></div>
        <p class="feedback" id="feedback" role="status"></p>
        <button id="nextButton" class="next-button" type="button" hidden>Siguiente pregunta</button>
      </section>
    </section>
  </main>

  <div class="modal" id="modal" hidden>
    <div class="modal-card">
      <p class="eyebrow" id="modalEyebrow">MISIÓN FINALIZADA</p>
      <div class="modal-icon" id="modalIcon">✦</div>
      <h2 id="modalTitle">¡Red protegida!</h2>
      <p id="modalText"></p>
      <button id="playAgain" class="next-button" type="button">Jugar otra vez</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
